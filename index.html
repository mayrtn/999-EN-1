<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade IA Mutante</title>
    <style>
      @font-face {
        font-family: 'PlanesValMore';
        src: url('/src/assets/fonts/Planes_ValMore.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0b12;
        overflow: hidden;
      }
      #game-root {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      /* Pixel-art nitido para la estetica 8-bit (Requirement 11.3). */
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
